<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icono Homyo — líneas más cortas</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#D9CFC7;color:#1a1a1a;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:48px 20px}
a{color:#8C1F2D}a:hover{color:#5e1420}
h1{font-size:20px;font-weight:600;margin:0}
.row{display:flex;gap:40px;flex-wrap:wrap;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:10px}
.icon{width:150px;height:150px;border-radius:36%;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.name{font-size:18px;color:#333}
.label{font-size:14px;font-weight:600;color:#444}
</style>
</head>
<body>
<h1>Líneas horizontales más cortas</h1>
<div class="row">
<div class="card"><img class="icon" src="icons/homyo-icon-512.png?v=10" alt="Actual"><div class="name">Homyo</div><div class="label">Actual</div></div>
<div class="card"><img class="icon" src="icons/propuesta-lineas-a.png" alt="A"><div class="name">Homyo</div><div class="label">A · Algo más cortas</div></div>
<div class="card"><img class="icon" src="icons/propuesta-lineas-b.png" alt="B"><div class="name">Homyo</div><div class="label">B · Mitad</div></div>
<div class="card"><img class="icon" src="icons/propuesta-lineas-c.png" alt="C"><div class="name">Homyo</div><div class="label">C · Muy cortas</div></div>
</div>
</body>
</html>
